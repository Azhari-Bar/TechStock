<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Laptop screen -->
  <rect x="190" y="110" width="420" height="280" rx="14" fill="#64748b"/>
  <rect x="204" y="124" width="392" height="252" rx="8" fill="url(#screen)"/>
  <!-- Screen content -->
  <rect x="230" y="150" width="160" height="12" rx="6" fill="#6366f1" opacity="0.9"/>
  <rect x="230" y="178" width="100" height="8" rx="4" fill="#475569"/>
  <rect x="230" y="200" width="340" height="8" rx="4" fill="#334155"/>
  <rect x="230" y="220" width="300" height="8" rx="4" fill="#334155"/>
  <rect x="230" y="240" width="320" height="8" rx="4" fill="#334155"/>
  <rect x="230" y="280" width="140" height="70" rx="8" fill="#1e293b"/>
  <rect x="390" y="280" width="140" height="70" rx="8" fill="#1e293b"/>
  <!-- Base -->
  <path d="M150 390 L650 390 L690 440 L110 440 Z" fill="url(#body)"/>
  <rect x="350" y="400" width="100" height="10" rx="5" fill="#64748b"/>
  <!-- Shadow -->
  <ellipse cx="400" cy="460" rx="290" ry="18" fill="#94a3b8" opacity="0.35"/>
